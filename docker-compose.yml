services:
  backend:
    image: vibe-coding-playground-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      TOSS_CLIENT_ID: ${TOSS_CLIENT_ID:-}
      TOSS_CLIENT_SECRET: ${TOSS_CLIENT_SECRET:-}
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-}
      APP_COMMIT_SHA: ${VERIFIED_SHA:-unknown}
      PORT: 8787
      MARKET_PRIMARY_REFRESH_MS: ${MARKET_PRIMARY_REFRESH_MS:-10000}
      POLL_MS: ${POLL_MS:-60000}
      SLOW_POLL_MS: ${SLOW_POLL_MS:-180000}
      THEME_FLOW_REFRESH_MS: ${THEME_FLOW_REFRESH_MS:-60000}
      US_THEME_FLOW_REFRESH_MS: ${US_THEME_FLOW_REFRESH_MS:-60000}
      FEATURE_NEWS_REFRESH_MS: ${FEATURE_NEWS_REFRESH_MS:-180000}
      THEME_REPLACEMENT_MARGIN: ${THEME_REPLACEMENT_MARGIN:-0.08}
      THEME_REPLACEMENT_CONFIRMATIONS: ${THEME_REPLACEMENT_CONFIRMATIONS:-3}
      MANUAL_REFRESH_COOLDOWN_MS: ${MANUAL_REFRESH_COOLDOWN_MS:-20000}
      MARKET_ALLOWED_ORIGIN: ${MARKET_ALLOWED_ORIGIN:-}
      FUTURES_SNAPSHOT_URL: ${FUTURES_SNAPSHOT_URL:-}
      FUTURES_SNAPSHOT_TOKEN: ${FUTURES_SNAPSHOT_TOKEN:-}
      FUTURES_REFRESH_MS: ${FUTURES_REFRESH_MS:-10000}
      MARKET_HISTORY_PATH: /app/data/market-history.jsonl
      MARKET_LATEST_PATH: /app/data/latest-market-snapshot.json
      PREPARED_DATA_DIR: /app/public-data
      THEME_CANDLE_CACHE_PATH: /app/data/theme-candles.json
      US_THEME_CANDLE_CACHE_PATH: /app/data/us-theme-candles.json
      QUIZ_UNIVERSE_CACHE_PATH: /app/data/quiz-universe.json
      DAILY_ISSUE_CACHE_PATH: /app/data/daily-issues.json
      CLOSE_ARCHIVE_CACHE_PATH: /app/data/close-archive.json
      MANUAL_THEME_PATH: /app/data/manual-themes.json
    volumes:
      - market-history:/app/data
      - dashboard-cache:/app/public-data
    restart: unless-stopped

  theme-admin:
    image: vibe-coding-playground-backend:latest
    command: ["node", "themeAdminServer.mjs"]
    environment:
      PORT: 8787
      MARKET_ALLOWED_ORIGIN: ${MARKET_ALLOWED_ORIGIN:-}
      THEME_ADMIN_WRITE_TOKEN: ${THEME_ADMIN_WRITE_TOKEN:-}
      MANUAL_THEME_PATH: /app/data/manual-themes.json
    volumes:
      - market-history:/app/data
    restart: unless-stopped

  frontend:
    image: vibe-coding-playground-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started
      theme-admin:
        condition: service_started
    volumes:
      - dashboard-cache:/usr/share/nginx/html/data:ro
    restart: unless-stopped

volumes:
  market-history:
  dashboard-cache:
