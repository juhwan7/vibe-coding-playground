server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Prepared snapshots are written continuously by the backend before users arrive.
  # Nginx serves them directly so page views do not trigger expensive market collection.
  location = /api/market/snapshot {
    try_files /data/market-snapshot.json @api_backend;
    add_header Cache-Control "no-cache, max-age=0" always;
    add_header X-Market-Source "prepared-snapshot" always;
  }

  # The prepared history is an 8-day / 1-minute superset. Both current dashboard
  # consumers can safely filter it client-side, and no JSONL parsing occurs on page view.
  location = /api/market/history {
    try_files /data/market-history.json @api_backend;
    add_header Cache-Control "no-cache, max-age=0" always;
    add_header X-Market-Source "prepared-snapshot" always;
  }

  location = /api/market/theme-flow {
    try_files /data/kr-theme-flow.json @api_backend;
    add_header Cache-Control "no-cache, max-age=0" always;
    add_header X-Market-Source "prepared-snapshot" always;
  }

  location = /api/market/us-theme-flow {
    try_files /data/us-theme-flow.json @api_backend;
    add_header Cache-Control "no-cache, max-age=0" always;
    add_header X-Market-Source "prepared-snapshot" always;
  }

  location = /api/market/feature-news {
    try_files /data/feature-news.json @api_backend;
    add_header Cache-Control "no-cache, max-age=0" always;
    add_header X-Market-Source "prepared-snapshot" always;
  }

  location @api_backend {
    proxy_pass http://backend:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
    add_header Cache-Control "no-store" always;
  }

  location /api/ {
    proxy_pass http://backend:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
    add_header Cache-Control "no-store" always;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    try_files $uri =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache, max-age=0" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, max-age=0" always;
  }
}
