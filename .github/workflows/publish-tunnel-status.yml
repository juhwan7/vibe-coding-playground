name: Publish Quick Tunnel Status

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows: ["Deploy to Raspberry Pi"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-quick-tunnel-status
  cancel-in-progress: true

jobs:
  publish:
    # Public-repo safety: this self-hosted job never runs pull-request code.
    # It only runs on a timer, an explicit manual dispatch, or after a successful
    # main-branch Pi deployment.
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: [self-hosted, linux, ARM64, k-market-pi]
    timeout-minutes: 3

    steps:
      - name: Detect, recover and publish current Quick Tunnel URL
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          SERVICE=market-tunnel.service
          FALLBACK_SERVICE=market-tunnel-fallback.service
          STATUS_BRANCH=tunnel-status
          STATUS_PATH=CURRENT_TUNNEL.md
          API="https://api.github.com/repos/$REPOSITORY"
          RAW="https://raw.githubusercontent.com/$REPOSITORY/$STATUS_BRANCH/$STATUS_PATH"
          RECOVERY_DIR="$HOME/.cache/market-flow"
          RECOVERY_MARKER="$RECOVERY_DIR/quick-tunnel-restart"
          RECOVERY_COOLDOWN_SECONDS=900

          detect_unit() {
            local fallback_state system_state user_state
            fallback_state="$(systemctl --user is-active "$FALLBACK_SERVICE" 2>/dev/null || true)"
            if [ "$fallback_state" = active ]; then
              printf 'fallback|active'
              return
            fi
            system_state="$(systemctl is-active "$SERVICE" 2>/dev/null || true)"
            if [ "$system_state" = active ]; then
              printf 'system|active'
              return
            fi
            user_state="$(systemctl --user is-active "$SERVICE" 2>/dev/null || true)"
            if [ "$user_state" = active ]; then
              printf 'user|active'
              return
            fi
            printf 'system|%s' "${system_state:-inactive}"
          }

          collect_logs() {
            journalctl -u "$SERVICE" --no-pager -n 1000 --since '2 days ago' 2>/dev/null || true
            systemctl status "$SERVICE" --no-pager -l 2>/dev/null || true
            journalctl --user -u "$SERVICE" --no-pager -n 1000 --since '2 days ago' 2>/dev/null || true
            systemctl --user status "$SERVICE" --no-pager -l 2>/dev/null || true
            # Put fallback logs last so a newly allocated fallback URL wins over
            # an older dead system-service URL when we select the final match.
            journalctl --user -u "$FALLBACK_SERVICE" --no-pager -n 1000 --since '2 days ago' 2>/dev/null || true
            systemctl --user status "$FALLBACK_SERVICE" --no-pager -l 2>/dev/null || true
          }

          detect_url() {
            collect_logs | grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' | tail -n 1 || true
          }

          check_url() {
            local url="$1"
            [ -n "$url" ] || return 1
            curl --fail --silent --show-error --connect-timeout 3 --max-time 6 \
              "$url/api/health" >/tmp/tunnel-health.json 2>/dev/null
          }

          restart_tunnel() {
            local scope="$1"
            case "$scope" in
              fallback) systemctl --user restart "$FALLBACK_SERVICE" >/dev/null 2>&1 ;;
              user) systemctl --user restart "$SERVICE" >/dev/null 2>&1 ;;
              system) sudo -n systemctl restart "$SERVICE" >/dev/null 2>&1 ;;
              *) return 1 ;;
            esac
          }

          start_user_fallback() {
            local cloudflared_bin=''
            for candidate in "$(command -v cloudflared 2>/dev/null || true)" /usr/local/bin/cloudflared /usr/bin/cloudflared; do
              if [ -n "$candidate" ] && [ -x "$candidate" ]; then
                cloudflared_bin="$candidate"
                break
              fi
            done
            if [ -z "$cloudflared_bin" ]; then
              echo 'cloudflared executable not found; cannot create user fallback tunnel'
              return 1
            fi

            # The frontend root is static and is the most reliable origin readiness
            # probe here. /api/health can briefly time out while the backend collector is
            # busy even though nginx and the app are already serving normally.
            if ! curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
              http://localhost:8080/ >/tmp/local-origin-index.html; then
              echo 'Local frontend is not reachable; refusing to create fallback tunnel'
              return 1
            fi

            mkdir -p "$HOME/.config/systemd/user"
            cat >"$HOME/.config/systemd/user/$FALLBACK_SERVICE" <<EOF
          [Unit]
          Description=MARKET FLOW user Quick Tunnel fallback
          After=network-online.target

          [Service]
          Type=simple
          ExecStart=$cloudflared_bin tunnel --no-autoupdate --url http://localhost:8080
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=default.target
          EOF
            sed -i 's/^          //' "$HOME/.config/systemd/user/$FALLBACK_SERVICE"

            systemctl --user daemon-reload >/dev/null 2>&1 || return 1
            systemctl --user enable "$FALLBACK_SERVICE" >/dev/null 2>&1 || true
            systemctl --user restart "$FALLBACK_SERVICE" >/dev/null 2>&1 || return 1
            echo "Started $FALLBACK_SERVICE with $cloudflared_bin"
            return 0
          }

          unit_info="$(detect_unit)"
          unit_scope="${unit_info%%|*}"
          unit_state="${unit_info#*|}"
          tunnel_url="$(detect_url)"
          reachable=false
          if check_url "$tunnel_url"; then
            reachable=true
          fi

          # An active cloudflared process can keep running after its Quick Tunnel URL
          # has expired. First try a normal restart. If the system unit is root-managed
          # and the runner cannot restart it, create a separate user-scoped cloudflared
          # unit. That gives the runner a recoverable tunnel without granting broad sudo.
          needs_recovery=false
          if [ "$unit_state" != active ] || { [ -n "$tunnel_url" ] && [ "$reachable" != true ]; }; then
            needs_recovery=true
          fi

          if [ "$needs_recovery" = true ]; then
            mkdir -p "$RECOVERY_DIR"
            now_epoch="$(date +%s)"
            last_restart=0
            if [ -e "$RECOVERY_MARKER" ]; then
              last_restart="$(stat -c %Y "$RECOVERY_MARKER" 2>/dev/null || echo 0)"
            fi
            age=$((now_epoch - last_restart))

            if [ "$age" -ge "$RECOVERY_COOLDOWN_SECONDS" ]; then
              echo "Quick Tunnel is not publicly reachable; attempting controlled recovery"
              old_url="$tunnel_url"
              restarted=false

              if [ "$unit_state" = active ] && restart_tunnel "$unit_scope"; then
                restarted=true
              elif start_user_fallback; then
                unit_scope=fallback
                unit_state=active
                restarted=true
              fi

              if [ "$restarted" = true ]; then
                touch "$RECOVERY_MARKER"
                reachable=false
                for attempt in $(seq 1 18); do
                  sleep 2
                  unit_info="$(detect_unit)"
                  unit_scope="${unit_info%%|*}"
                  unit_state="${unit_info#*|}"
                  candidate="$(detect_url)"
                  if [ -n "$candidate" ]; then
                    tunnel_url="$candidate"
                    if check_url "$tunnel_url"; then
                      reachable=true
                      break
                    fi
                  fi
                done
                echo "Tunnel recovery finished: ${old_url:-none} -> ${tunnel_url:-none}"
              else
                echo "Tunnel recovery was not permitted or fallback startup failed"
              fi
            else
              echo "Recovery cooldown active (${age}s/${RECOVERY_COOLDOWN_SECONDS}s); not restarting again"
            fi
          fi

          # Refresh final state after any recovery attempt.
          unit_info="$(detect_unit)"
          unit_scope="${unit_info%%|*}"
          unit_state="${unit_info#*|}"
          tunnel_url="$(detect_url)"
          if check_url "$tunnel_url"; then
            reachable=true
          else
            reachable=false
          fi

          if [ -z "$tunnel_url" ]; then
            status=offline
          elif [ "$reachable" = true ]; then
            status=online
          else
            status=unreachable
          fi

          old="$(curl --fail --silent --show-error --max-time 8 "$RAW" 2>/dev/null || true)"
          old_url="$(printf '%s' "$old" | grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' | head -n 1 || true)"
          old_status="$(printf '%s' "$old" | sed -n 's/^- 상태: `\([^`]*\)`.*/\1/p' | head -n 1)"

          echo "Tunnel service: ${unit_state:-unknown} ($unit_scope)"
          echo "Detected URL: ${tunnel_url:-none}"
          echo "Reachability: $status"

          # Avoid a commit every five minutes. Publish only when URL/status changes.
          if [ "$old_url" = "$tunnel_url" ] && [ "$old_status" = "$status" ]; then
            echo "Tunnel address/status unchanged; registry already current"
            exit 0
          fi

          changed_at="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          if [ -n "$tunnel_url" ]; then
            cat >/tmp/current-tunnel.md <<EOF
          # MARKET FLOW 현재 접속 주소

          - 상태: \`$status\`
          - 갱신 시각: \`$changed_at\`
          - Raspberry Pi tunnel service: \`${unit_state:-unknown}\` (\`$unit_scope\`)

          ## 접속

          **[$tunnel_url]($tunnel_url)**

          이 파일은 Raspberry Pi가 5분마다 Cloudflare Quick Tunnel 주소를 확인해 자동 갱신합니다. 기존 system 서비스가 만료됐고 runner가 재시작 권한이 없으면 sudo 권한을 넓히지 않고 user-scoped fallback 터널을 자동으로 생성합니다.
          EOF
          else
            cat >/tmp/current-tunnel.md <<EOF
          # MARKET FLOW 현재 접속 주소

          - 상태: \`$status\`
          - 갱신 시각: \`$changed_at\`
          - Raspberry Pi tunnel service: \`${unit_state:-unknown}\` (\`$unit_scope\`)

          현재 유효한 \`trycloudflare.com\` 주소를 감지하지 못했습니다. 이 파일은 5분 안에 다시 자동 확인합니다.
          EOF
          fi

          sed -i 's/^          //' /tmp/current-tunnel.md
          encoded="$(base64 -w 0 /tmp/current-tunnel.md)"

          meta_file=/tmp/tunnel-meta.json
          http_code="$(curl --silent --show-error -o "$meta_file" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API/contents/$STATUS_PATH?ref=$STATUS_BRANCH")"

          sha=''
          if [ "$http_code" = 200 ]; then
            sha="$(tr -d '\n' <"$meta_file" | sed -n 's/.*"sha":[[:space:]]*"\([^"]*\)".*/\1/p')"
          elif [ "$http_code" != 404 ]; then
            cat "$meta_file" || true
            echo "Unable to read tunnel registry metadata (HTTP $http_code)"
            exit 1
          fi

          if [ -n "$sha" ]; then
            printf '{"message":"chore: update current Quick Tunnel address","content":"%s","branch":"%s","sha":"%s"}' \
              "$encoded" "$STATUS_BRANCH" "$sha" >/tmp/tunnel-update.json
          else
            printf '{"message":"chore: publish current Quick Tunnel address","content":"%s","branch":"%s"}' \
              "$encoded" "$STATUS_BRANCH" >/tmp/tunnel-update.json
          fi

          curl --fail --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API/contents/$STATUS_PATH" \
            --data-binary @/tmp/tunnel-update.json >/tmp/tunnel-publish-result.json

          echo "Published current tunnel status to $STATUS_BRANCH/$STATUS_PATH"
