name: Generate package lock

on:
  push:
    paths:
      - package.json
      - .github/workflows/generate-package-lock.yml

permissions:
  contents: write

concurrency:
  group: package-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile only when missing
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            echo 'package-lock.json already exists; nothing to do.'
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'Add reproducible npm lockfile'
          git push origin "HEAD:${GITHUB_REF_NAME}"
