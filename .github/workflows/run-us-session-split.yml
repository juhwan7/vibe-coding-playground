name: Run US Session Split

on:
  push:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply session split
        run: python3 .github/apply-us-session-split.py
      - name: Install dependencies
        run: npm ci
      - name: Verify feature
        run: |
          npm run check
          node --test backend/usThemeFlowService.test.mjs
          npm run build
      - name: Commit feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'juhwan7'
          git config user.email '43717710+juhwan7@users.noreply.github.com'
          git rm -f .github/apply-us-session-split.py .github/workflows/apply-us-session-split.yml .github/workflows/apply-us-session-split-v2.yml .github/workflows/run-us-session-split.yml .github/us-session-split-trigger.txt
          git add backend/usThemeFlowService.mjs backend/usThemeFlowService.test.mjs src/UsMarketWorkspace.tsx src/marketWorkspaceEnhancements.css
          git commit -m 'feat: 미국 정규장과 애프터 흐름 분리'
          git push origin HEAD:main
