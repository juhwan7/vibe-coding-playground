name: Quiz Runtime Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quiz-runtime-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, ARM64, k-market-pi]
    timeout-minutes: 4
    steps:
      - name: Inspect live quiz runtime
        shell: bash
        run: |
          set -u
          APP="$HOME/vibe-coding-playground"
          cd "$APP"
          echo '=== deployed checkout ==='
          git rev-parse HEAD || true
          echo
          echo '=== quiz universe API ==='
          curl --silent --show-error --max-time 20 http://127.0.0.1:8080/api/quiz/universe || true
          echo
          echo
          echo '=== persistent quiz summary ==='
          docker compose exec -T backend node -e "const fs=require('fs'); for (const p of ['/app/data/quiz-universe.json','/app/data/quiz-descriptions.json','/app/public-data/quiz-prepared.json']) { try { const s=fs.statSync(p); const j=JSON.parse(fs.readFileSync(p,'utf8')); const values=Object.values(j.items||{}); const poolCounts=values.reduce((a,x)=>{const k=x&&x.pool||'none';a[k]=(a[k]||0)+1;return a},{}); console.log(p, {bytes:s.size, source:j.source, sourceDate:j.sourceDate, ok:j.ok, stale:j.stale, counts:j.counts, expectedCounts:j.expectedCounts, cacheStatus:j.cacheStatus, itemCount:values.length||undefined, poolCounts, error:j.error}); } catch(e) { console.log(p, 'ERROR', e.message); } }" || true
          echo
          echo '=== official benchmark ETF raw holdings probes ==='
          for row in \
            'RISE200|https://www.riseetf.co.kr/prod/finderDetail/4435?searchFlag=viewtab3' \
            'RISEKQ150|https://www.riseetf.co.kr/prod/finderDetail/4459?searchFlag=viewtab3' \
            'PLUS200|https://www.plusetf.co.kr/product/detail?n=006184' \
            'PLUSKQ150|https://www.plusetf.co.kr/product/detail?n=006318'; do
            label="${row%%|*}"
            url="${row#*|}"
            body="$(curl --silent --show-error --max-time 20 -L -A 'Mozilla/5.0' -H 'Accept-Language: ko-KR,ko;q=0.9' "$url" 2>/dev/null || true)"
            rise_isin="$(printf '%s' "$body" | grep -Eo 'KR7[0-9]{9}' | sort -u | wc -l | tr -d ' ')"
            six_codes="$(printf '%s' "$body" | grep -Eo '(^|[^0-9])[0-9]{6}([^0-9]|$)' | grep -Eo '[0-9]{6}' | sort -u | wc -l | tr -d ' ')"
            echo "$label bytes=${#body} riseISIN=$rise_isin sixDigitTokens=$six_codes"
          done
          echo
          echo '=== Naver KPI200 page count probe ==='
          for page in 1 2 19 20 21; do
            body="$(curl --silent --show-error --max-time 10 -A 'Mozilla/5.0' -e 'https://finance.naver.com/' "https://finance.naver.com/sise/entryJongmok.naver?indCode=KPI200&page=${page}" 2>/dev/null || true)"
            count="$(printf '%s' "$body" | grep -Eo 'item/main\.naver\?code=[0-9]{6}' | sort -u | wc -l | tr -d ' ')"
            echo "KPI200 page${page} => ${count}"
          done
          echo
          echo '=== backend quiz logs ==='
          docker compose logs --since=10m backend 2>&1 | grep -Ei 'quiz|KRX|KODEX|description|prewarm|fallback' | tail -n 120 || true
