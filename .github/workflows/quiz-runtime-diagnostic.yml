name: Quiz Runtime Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quiz-runtime-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, ARM64, k-market-pi]
    timeout-minutes: 4
    steps:
      - name: Inspect live quiz runtime
        shell: bash
        run: |
          set -u
          APP="$HOME/vibe-coding-playground"
          cd "$APP"
          echo '=== deployed checkout ==='
          git rev-parse HEAD || true
          echo
          echo '=== running backend contains quiz fallback ==='
          docker compose exec -T backend sh -c "grep -n 'benchmark-etf-composition-fallback\|KODEX 200' /app/quizUniverseService.mjs | head -n 20" || true
          echo
          echo '=== quiz universe API ==='
          curl --silent --show-error --max-time 20 http://127.0.0.1:8080/api/quiz/universe || true
          echo
          echo
          echo '=== Naver index constituent probes ==='
          JAR=/tmp/naver-quiz-cookies.txt
          curl --silent --show-error --max-time 10 -c "$JAR" -A 'Mozilla/5.0' 'https://finance.naver.com/' >/dev/null || true
          for code in KPI200 KQ150 KOSDAQ150; do
            body="$(curl --silent --show-error --max-time 10 -b "$JAR" -c "$JAR" -A 'Mozilla/5.0' -e 'https://finance.naver.com/' "https://finance.naver.com/sise/entryJongmok.naver?indCode=${code}&page=1" 2>/dev/null || true)"
            count="$(printf '%s' "$body" | grep -Eo 'item/main\.naver\?code=[0-9]{6}' | sort -u | wc -l | tr -d ' ')"
            echo "$code page1 => unique stock links: $count"
            printf '%s' "$body" | grep -Eo 'item/main\.naver\?code=[0-9]{6}[^>]*>[^<]+' | head -n 3 || true
          done
          echo
          echo '=== Toss KODEX 200 composition pagination probes ==='
          BASE='https://wts-info-api.tossinvest.com/api/v2/stock-infos/A069500/compositions'
          for suffix in '' '?limit=300' '?size=300' '?page=1&size=300' '?limit=300&offset=0' '?count=300' '?page=1&perPage=300'; do
            url="${BASE}${suffix}"
            body="$(curl --silent --show-error --max-time 15 -H 'Origin: https://tossinvest.com' -H 'Referer: https://tossinvest.com/' -H 'User-Agent: Mozilla/5.0' "$url" 2>/dev/null || true)"
            count="$(printf '%s' "$body" | grep -o '"stockCode"' | wc -l | tr -d ' ')"
            echo "${suffix:-base} => stockCode count: $count"
          done
          echo
          echo '=== prepared quiz now ==='
          curl --silent --show-error --max-time 10 http://127.0.0.1:8080/data/quiz-prepared.json || true
          echo
          echo
          echo '=== persistent quiz files ==='
          docker compose exec -T backend sh -c 'ls -lh /app/data/quiz-universe.json /app/data/quiz-descriptions.json /app/public-data/quiz-prepared.json 2>/dev/null || true; echo; head -c 1600 /app/data/quiz-universe.json 2>/dev/null || true' || true
          echo
          echo
          echo '=== backend quiz logs ==='
          docker compose logs --since=10m backend 2>&1 | grep -Ei 'quiz|KRX|KODEX|description|prewarm|fallback' | tail -n 120 || true
