name: Quiz Runtime Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quiz-runtime-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, ARM64, k-market-pi]
    timeout-minutes: 4
    steps:
      - name: Inspect live quiz runtime
        shell: bash
        run: |
          set -euo pipefail
          APP="$HOME/vibe-coding-playground"
          cd "$APP"

          echo '=== deployed checkout ==='
          git rev-parse HEAD
          echo
          echo '=== deployed quiz fallback markers ==='
          docker compose exec -T backend sh -c "grep -n 'RISE ETF\|official-benchmark-etf-holdings-fallback\|mixed-public-web-fallback' /app/quizUniverseService.mjs | head -n 20" || true
          echo

          echo '=== live quiz universe ==='
          UNIVERSE=''
          for attempt in $(seq 1 6); do
            UNIVERSE="$(curl --fail --silent --show-error --max-time 30 http://127.0.0.1:8080/api/quiz/universe || true)"
            if printf '%s' "$UNIVERSE" | docker compose exec -T backend node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);const k=j.counts?.kospi200??0;const q=j.counts?.kosdaq150??0;console.log(JSON.stringify({attempt:Number(process.argv[1]),ok:j.ok,source:j.source,mode:j.universeMode,counts:j.counts,error:j.error}));process.exit(j.ok&&k>=192&&q>=142?0:1)}catch(e){console.log('universe parse error',e.message);process.exit(1)}})" "$attempt"; then
              break
            fi
            if [ "$attempt" -lt 6 ]; then sleep 5; fi
          done

          printf '%s' "$UNIVERSE" | docker compose exec -T backend node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log('UNIVERSE_SUMMARY',JSON.stringify({ok:j.ok,source:j.source,mode:j.universeMode,counts:j.counts,warning:j.warning,error:j.error}));const k=j.counts?.kospi200??0;const q=j.counts?.kosdaq150??0;if(!j.ok||k<192||q<142)process.exit(1)})"
          echo

          echo '=== prepared quiz readiness ==='
          PREPARED=''
          READY=0
          for attempt in $(seq 1 18); do
            PREPARED="$(curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8080/data/quiz-prepared.json || true)"
            if printf '%s' "$PREPARED" | docker compose exec -T backend node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);const k=j.counts?.kospi200??0;const q=j.counts?.kosdaq150??0;console.log(JSON.stringify({attempt:Number(process.argv[1]),counts:j.counts,cacheStatus:j.cacheStatus,error:j.error}));process.exit(j.ok&&k>=4&&q>=4?0:1)}catch(e){console.log('prepared parse error',e.message);process.exit(1)}})" "$attempt"; then
              READY=1
              break
            fi
            if [ "$attempt" -lt 18 ]; then sleep 5; fi
          done

          printf '%s' "$PREPARED" | docker compose exec -T backend node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log('PREPARED_SUMMARY',JSON.stringify({ok:j.ok,source:j.source,counts:j.counts,cacheStatus:j.cacheStatus,error:j.error}));})"
          if [ "$READY" -ne 1 ]; then
            echo 'Prepared quiz did not reach >=4 stocks in both pools.'
            echo '=== backend quiz logs ==='
            docker compose logs --since=15m backend 2>&1 | grep -Ei 'quiz|KRX|RISE|Npay|KODEX|description|prewarm|fallback' | tail -n 180 || true
            exit 1
          fi
          echo

          echo '=== persistent quiz summary ==='
          docker compose exec -T backend node -e "const fs=require('fs'); for (const p of ['/app/data/quiz-universe.json','/app/data/quiz-descriptions.json','/app/public-data/quiz-prepared.json']) { try { const s=fs.statSync(p); const j=JSON.parse(fs.readFileSync(p,'utf8')); const values=Object.values(j.items||{}); const poolCounts=values.reduce((a,x)=>{const k=x&&x.pool||'none';a[k]=(a[k]||0)+1;return a},{}); console.log(p, {bytes:s.size, source:j.source, sourceDate:j.sourceDate, ok:j.ok, stale:j.stale, counts:j.counts, expectedCounts:j.expectedCounts, cacheStatus:j.cacheStatus, itemCount:values.length||undefined, poolCounts, error:j.error}); } catch(e) { console.log(p, 'ERROR', e.message); } }"
          echo
          echo '=== backend quiz logs ==='
          docker compose logs --since=15m backend 2>&1 | grep -Ei 'quiz|KRX|RISE|Npay|KODEX|description|prewarm|fallback' | tail -n 180 || true
