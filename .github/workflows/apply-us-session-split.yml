name: Apply US Session Split

on:
  push:
    paths:
      - '.github/workflows/apply-us-session-split.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply regular vs after-hours split
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          backend = 'backend/usThemeFlowService.mjs'

          replace_once(backend,
          """export async function loadUsLivePrices(client, symbols, fallbackTimestamp = new Date().toISOString()) {
            const unique = [...new Set((symbols ?? []).map((symbol) => String(symbol || '').trim().toUpperCase()).filter(Boolean))]
            if (!unique.length) return []
            const encoded = encodeURIComponent(unique.join(','))
            const payload = await client.request(`/api/v1/prices?symbols=${encoded}`)
            return priceRecords(payload).map((item) => ({
              symbol: item?.symbol ?? item?.stock?.symbol ?? null,
              lastPrice: number(item?.lastPrice ?? item?.price?.lastPrice),
              timestamp: item?.timestamp ?? item?.price?.timestamp ?? fallbackTimestamp,
            })).filter((item) => item.symbol && item.lastPrice != null && item.timestamp)
          }
          """,
          """export async function loadUsLivePrices(client, symbols, fallbackTimestamp = new Date().toISOString()) {
            const unique = [...new Set((symbols ?? []).map((symbol) => String(symbol || '').trim().toUpperCase()).filter(Boolean))]
            if (!unique.length) return []
            const encoded = encodeURIComponent(unique.join(','))
            const payload = await client.request(`/api/v1/prices?symbols=${encoded}`)
            return priceRecords(payload).map((item) => {
              const sourceTimestamp = item?.timestamp ?? item?.price?.timestamp ?? null
              return {
                symbol: item?.symbol ?? item?.stock?.symbol ?? null,
                lastPrice: number(item?.lastPrice ?? item?.price?.lastPrice),
                timestamp: sourceTimestamp ?? fallbackTimestamp,
                timestampVerified: Boolean(sourceTimestamp),
              }
            }).filter((item) => item.symbol && item.lastPrice != null && item.timestamp)
          }
          """)

          replace_once(backend,
          """function isRegularTimestamp(timestamp) {
            const { hour, minute, second } = usTimeParts(timestamp)
            const totalSeconds = hour * 3600 + minute * 60 + second
            return totalSeconds >= (9 * 3600 + 30 * 60) && totalSeconds <= 16 * 3600
          }

          function isRegularCandle(candle) {
          """,
          """function isRegularTimestamp(timestamp) {
            const { hour, minute, second } = usTimeParts(timestamp)
            const totalSeconds = hour * 3600 + minute * 60 + second
            return totalSeconds >= (9 * 3600 + 30 * 60) && totalSeconds <= 16 * 3600
          }

          export function isUsPostMarketTimestamp(timestamp) {
            const { hour, minute, second } = usTimeParts(timestamp)
            const totalSeconds = hour * 3600 + minute * 60 + second
            return totalSeconds > 16 * 3600 && totalSeconds <= 20 * 3600
          }

          function isLiveSampleTimestamp(timestamp) {
            return isRegularTimestamp(timestamp) || isUsPostMarketTimestamp(timestamp)
          }

          function isRegularCandle(candle) {
          """)

          replace_once(backend,
          """  for (const sample of [...(existing ?? []), ...(incoming ?? [])]) {
              if (!sample?.timestamp || sample.lastPrice == null || !isRegularTimestamp(sample.timestamp)) continue
              const bucket = bucket30s(sample.timestamp)
              if (bucket == null) continue
              const timestamp = new Date(bucket).toISOString()
              map.set(timestamp, {
                timestamp,
                observedAt: sample.observedAt ?? sample.timestamp,
                lastPrice: number(sample.lastPrice),
              })
            }
          """,
          """  for (const sample of [...(existing ?? []), ...(incoming ?? [])]) {
              if (!sample?.timestamp || sample.lastPrice == null || !isLiveSampleTimestamp(sample.timestamp)) continue
              if (isUsPostMarketTimestamp(sample.timestamp) && sample.timestampVerified === false) continue
              const bucket = bucket30s(sample.timestamp)
              if (bucket == null) continue
              const timestamp = new Date(bucket).toISOString()
              map.set(timestamp, {
                timestamp,
                observedAt: sample.observedAt ?? sample.timestamp,
                lastPrice: number(sample.lastPrice),
                timestampVerified: sample.timestampVerified ?? true,
              })
            }
          """)

          replace_once(backend,
          """export function mergeUsThemePoints(historyPoints = [], livePoints = []) {
          """,
          """export function aggregateUsAfterHoursThemeSeries(memberSeries) {
            const buckets = new Map()
            for (const { symbol, regularClose, samples = [], weight = 0 } of memberSeries) {
              if (!regularClose || !samples.length) continue
              for (const sample of samples) {
                if (!isUsPostMarketTimestamp(sample.timestamp) || sample.timestampVerified === false || sample.lastPrice == null) continue
                const key = bucket30s(sample.timestamp)
                if (key == null) continue
                const aggregate = buckets.get(key) ?? { timestamp: new Date(key).toISOString(), values: [], weights: [], symbols: new Set() }
                aggregate.values.push((sample.lastPrice / regularClose - 1) * 100)
                aggregate.weights.push(Math.max(0, Number(weight) || 0))
                aggregate.symbols.add(symbol)
                buckets.set(key, aggregate)
              }
            }

            return [...buckets.values()]
              .sort((a, b) => Date.parse(a.timestamp) - Date.parse(b.timestamp))
              .map((bucket) => ({
                timestamp: bucket.timestamp,
                value: weightedAverage(bucket.values, bucket.weights),
                volume: 0,
                tradingAmount: null,
                memberCount: bucket.symbols.size,
                day: usDateKey(bucket.timestamp),
                source: '30s-after-hours',
              }))
          }

          export function mergeUsThemePoints(historyPoints = [], livePoints = []) {
          """)

          replace_once(backend,
          """function usRegularSessionActive() {
            const now = new Date()
            const weekday = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', weekday: 'short' }).format(now)
            if (weekday === 'Sat' || weekday === 'Sun') return false
            return isRegularTimestamp(now.toISOString())
          }

          export class UsThemeFlowService {
          """,
          """function usRegularSessionActive() {
            const now = new Date()
            const weekday = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', weekday: 'short' }).format(now)
            if (weekday === 'Sat' || weekday === 'Sun') return false
            return isRegularTimestamp(now.toISOString())
          }

          function usPostMarketSessionActive() {
            const now = new Date()
            const weekday = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', weekday: 'short' }).format(now)
            if (weekday === 'Sat' || weekday === 'Sun') return false
            return isUsPostMarketTimestamp(now.toISOString())
          }

          function usLiveSamplingActive() {
            return usRegularSessionActive() || usPostMarketSessionActive()
          }

          export class UsThemeFlowService {
          """)

          replace_once(backend,
          """    const delay = usRegularSessionActive() ? this.liveSampleMs : 300000
          """,
          """    const delay = usLiveSamplingActive() ? this.liveSampleMs : 300000
          """)

          replace_once(backend,
          """        const samples = (this.livePriceCache.get(member.symbol) ?? []).filter((sample) => !visibleDays.size || visibleDays.has(usDateKey(sample.timestamp)))
          """,
          """        const samples = (this.livePriceCache.get(member.symbol) ?? []).filter((sample) =>
                  isRegularTimestamp(sample.timestamp) && (!visibleDays.size || visibleDays.has(usDateKey(sample.timestamp))))
          """)

          replace_once(backend,
          """  async sampleLivePrices() {
            if (this.liveSampling || this.refreshing || !this.client.configured || !usRegularSessionActive() || !this.activeGroups.length) return this.payload
          """,
          """  buildRegularSessionSummary(themes = this.buildThemes()) {
            const regularPoints = themes.flatMap((theme) => theme.points ?? []).filter((point) => isRegularTimestamp(point.timestamp))
            const days = [...new Set(regularPoints.map((point) => point.day))].sort()
            const day = days.at(-1) ?? null
            const summaries = themes.map((theme) => {
              const points = (theme.points ?? [])
                .filter((point) => (!day || point.day === day) && isRegularTimestamp(point.timestamp))
                .sort((a, b) => Date.parse(a.timestamp) - Date.parse(b.timestamp))
              const first = points[0] ?? null
              const last = points.at(-1) ?? null
              return {
                name: theme.name,
                memberCount: theme.memberCount,
                tradingAmount: theme.tradingAmount,
                sessionChange: first && last ? last.value - first.value : null,
                closeValue: last?.value ?? null,
                closedAt: last?.timestamp ?? null,
              }
            })
            const closedAt = summaries.map((item) => item.closedAt).filter(Boolean).sort().at(-1) ?? null
            return { day, closedAt, themes: summaries }
          }

          buildAfterHours(groups = this.activeGroups) {
            const allSymbols = [...new Set(groups.flatMap((group) => group.members.map((member) => member.symbol).filter(Boolean)))]
            const regularDays = [...new Set(allSymbols.flatMap((symbol) =>
              (this.candleCache.get(symbol) ?? []).filter(isRegularCandle).map((candle) => usDateKey(candle.timestamp))))].sort()
            const sessionDay = regularDays.at(-1) ?? null
            const moverBySymbol = new Map()
            const themes = groups.map((group) => {
              const members = group.members.map((member) => this.enrichRanking(member)).filter(isUsIndividualStock)
              const memberSeries = []
              for (const member of members) {
                const regularCandles = (this.candleCache.get(member.symbol) ?? [])
                  .filter((candle) => (!sessionDay || usDateKey(candle.timestamp) === sessionDay) && isRegularCandle(candle))
                  .sort((a, b) => Date.parse(a.timestamp) - Date.parse(b.timestamp))
                const regularClose = regularCandles.at(-1)?.closePrice ?? null
                if (regularClose == null) continue
                const samples = (this.livePriceCache.get(member.symbol) ?? [])
                  .filter((sample) => (!sessionDay || usDateKey(sample.timestamp) === sessionDay) && isUsPostMarketTimestamp(sample.timestamp) && sample.timestampVerified !== false)
                  .sort((a, b) => Date.parse(a.timestamp) - Date.parse(b.timestamp))
                if (!samples.length) continue
                const latest = samples.at(-1)
                const afterHoursChangeRate = (latest.lastPrice / regularClose - 1) * 100
                memberSeries.push({ symbol: member.symbol, regularClose, samples, weight: member.tradingAmount ?? 0 })
                if (!moverBySymbol.has(member.symbol)) {
                  moverBySymbol.set(member.symbol, {
                    symbol: member.symbol,
                    name: member.name ?? member.englishName ?? member.symbol,
                    market: member.market ?? 'US',
                    theme: group.name,
                    regularClose,
                    afterHoursPrice: latest.lastPrice,
                    afterHoursChangeRate,
                    sampledAt: latest.timestamp,
                  })
                }
              }
              const points = aggregateUsAfterHoursThemeSeries(memberSeries)
              return {
                name: group.name,
                regularMemberCount: members.length,
                observedMemberCount: memberSeries.length,
                currentValue: points.at(-1)?.value ?? null,
                sampledAt: points.at(-1)?.timestamp ?? null,
                points,
              }
            }).slice(0, 5)
            const movers = [...moverBySymbol.values()]
              .sort((a, b) => Math.abs(b.afterHoursChangeRate) - Math.abs(a.afterHoursChangeRate))
              .slice(0, 15)
            const latestSampledAt = movers.map((item) => item.sampledAt).filter(Boolean).sort().at(-1) ?? null
            return {
              sessionDay,
              active: usPostMarketSessionActive(),
              observedSymbols: moverBySymbol.size,
              sampledAt: latestSampledAt,
              themes,
              movers,
              source: 'verified-current-price-samples',
              note: '정규장 16:00 ET 종가 대비 실제 애프터 가격 샘플만 표시하며 애프터 거래대금은 임의 계산하지 않습니다.',
            }
          }

          async sampleLivePrices() {
            if (this.liveSampling || this.refreshing || !this.client.configured || !usLiveSamplingActive() || !this.activeGroups.length) return this.payload
          """)

          replace_once(backend,
          """        const themes = this.buildThemes()
                this.payload = {
                  ...this.payload,
                  ok: true,
                  updatedAt: new Date().toISOString(),
                  themes,
                  stage: themes.some((theme) => theme.points.length >= 2) ? 'ready' : this.payload.stage,
                  liveSampledAt: new Date().toISOString(),
                  liveSampleCount: samples.length,
                }
          """,
          """        const themes = this.buildThemes()
                this.payload = {
                  ...this.payload,
                  ok: true,
                  updatedAt: new Date().toISOString(),
                  themes,
                  regularSession: this.buildRegularSessionSummary(themes),
                  afterHours: this.buildAfterHours(),
                  stage: themes.some((theme) => theme.points.length >= 2) ? 'ready' : this.payload.stage,
                  liveSampledAt: new Date().toISOString(),
                  liveSampleCount: samples.length,
                }
          """)

          replace_once(backend,
          """        topRankings,
                themes,
                stage: themes.some((theme) => theme.points.length >= 2) ? 'ready' : 'rankings-ready',
          """,
          """        topRankings,
                themes,
                regularSession: this.buildRegularSessionSummary(themes),
                afterHours: this.buildAfterHours(groups),
                stage: themes.some((theme) => theme.points.length >= 2) ? 'ready' : 'rankings-ready',
          """)

          replace_once(backend,
          """          chartSession: 'US regular 09:30-16:00 ET',
                  historyTradingDays: 2,
          """,
          """          chartSession: 'US regular 09:30-16:00 ET only',
                  afterHoursSession: 'US after-hours 16:00-20:00 ET; verified current-price samples only; regular close baseline=0%',
                  dataSeparation: 'regular detail is not duplicated in after-hours; after-hours exposes delta/flow only',
                  historyTradingDays: 2,
          """)

          # Frontend types + session comparison UI.
          frontend = 'src/UsMarketWorkspace.tsx'
          replace_once(frontend,
          """  themes?: ThemeGroup[]
            error?: string | null
          }
          """,
          """  themes?: ThemeGroup[]
            regularSession?: {
              day?: string | null
              closedAt?: string | null
              themes?: Array<{ name: string; memberCount: number; tradingAmount: number; sessionChange: number | null; closeValue: number | null; closedAt: string | null }>
            }
            afterHours?: {
              sessionDay?: string | null
              active?: boolean
              observedSymbols?: number
              sampledAt?: string | null
              source?: string
              note?: string
              themes?: Array<{ name: string; regularMemberCount: number; observedMemberCount: number; currentValue: number | null; sampledAt: string | null; points: ThemePoint[] }>
              movers?: Array<{ symbol: string; name: string; market: string; theme: string; regularClose: number; afterHoursPrice: number; afterHoursChangeRate: number; sampledAt: string }>
            }
            error?: string | null
          }
          """)

          replace_once(frontend,
          """function UsThemeRow({ theme, rank }: { theme: ThemeGroup; rank: number }) {
          """,
          """function AfterHoursSparkline({ points, accent }: { points: ThemePoint[]; accent: string }) {
            const sorted = [...(points ?? [])].sort((a, b) => Date.parse(a.timestamp) - Date.parse(b.timestamp))
            if (sorted.length < 2) return <span className=\"us-after-spark-empty\">실제 샘플 대기</span>
            const width = 220
            const height = 46
            const values = [0, ...sorted.map((point) => point.value)]
            const lo = Math.min(...values)
            const hi = Math.max(...values)
            const pad = Math.max(.08, (hi - lo) * .14)
            const min = lo - pad
            const max = hi + pad
            const range = Math.max(.01, max - min)
            const start = Date.parse(sorted[0].timestamp)
            const end = Math.max(start + 1, Date.parse(sorted.at(-1)!.timestamp))
            const x = (timestamp: string) => (Date.parse(timestamp) - start) / (end - start) * width
            const y = (value: number) => height - 4 - ((value - min) / range) * (height - 8)
            const path = sorted.map((point, index) => `${index ? 'L' : 'M'}${x(point.timestamp).toFixed(1)},${y(point.value).toFixed(1)}`).join(' ')
            return <svg className=\"us-after-spark\" viewBox={`0 0 ${width} ${height}`} preserveAspectRatio=\"none\" aria-label=\"정규장 종료 후 테마 변화 흐름\" style={{ ['--theme-accent' as string]: accent } as CSSProperties}>
              <line x1=\"0\" x2={width} y1={y(0)} y2={y(0)} className=\"us-after-zero\" />
              <path d={path} className=\"us-after-line\" />
            </svg>
          }

          function UsThemeRow({ theme, rank }: { theme: ThemeGroup; rank: number }) {
          """)

          replace_once(frontend,
          """  const themeMembership = useMemo(() => {
            const map = new Map<string, { name: string; accent: string }>()
          """,
          """  const regularSession = flow.regularSession
            const afterHours = flow.afterHours
            const afterThemeMap = useMemo(() => new Map((afterHours?.themes ?? []).map((theme) => [theme.name, theme])), [afterHours?.themes])
            const regularThemeMap = useMemo(() => new Map((regularSession?.themes ?? []).map((theme) => [theme.name, theme])), [regularSession?.themes])
            const afterMovers = afterHours?.movers ?? []
            const themeMembership = useMemo(() => {
            const map = new Map<string, { name: string; accent: string }>()
          """)

          replace_once(frontend,
          """    <section className=\"workspace-main\">
              <section className=\"theme-strength-board panel\" data-testid=\"us-theme-strength-board\">
          """,
          """    <section className=\"workspace-main\">
              <section className=\"us-session-compare panel\" data-testid=\"us-session-compare\">
                <header className=\"us-session-compare-head\">
                  <div><p>REGULAR CLOSE → AFTER HOURS</p><h1>전날 밤 정규장 마감과 정규장 이후 변화</h1><small>정규장 데이터는 왼쪽 값에 한 번만 사용하고, 애프터 영역은 16:00 ET 종가를 0% 기준으로 잡은 이후 실제 가격 변화만 표시합니다.</small></div>
                  <div className=\"us-session-status\"><span>정규장 {regularSession?.day ? compactDay(regularSession.day) : '-'}</span><b>→</b><span className={afterHours?.active ? 'flow-live' : ''}>애프터 {afterHours?.active ? '진행 중' : afterMovers.length ? '최근 기록' : '수집 대기'}</span></div>
                </header>
                <div className=\"us-session-compare-grid\">
                  <div className=\"us-session-column-head\">테마</div><div className=\"us-session-column-head\">정규장 하루</div><div className=\"us-session-column-head\">정규장 이후</div><div className=\"us-session-column-head\">16:00 ET 이후 흐름</div>
                  {themes.map((theme, index) => {
                    const regular = regularThemeMap.get(theme.name)
                    const after = afterThemeMap.get(theme.name)
                    const accent = ACCENTS[index % ACCENTS.length]
                    return <div className=\"us-session-compare-row\" key={`session-${theme.name}`} style={{ ['--theme-accent' as string]: accent } as CSSProperties}>
                      <div className=\"us-session-theme\"><i /><strong>{theme.name}</strong><small>{regular?.memberCount ?? theme.memberCount}종목</small></div>
                      <strong className={(regular?.sessionChange ?? 0) >= 0 ? 'up' : 'down'}>{fmtRate(regular?.sessionChange)}</strong>
                      <div className=\"us-after-value\"><strong className={(after?.currentValue ?? 0) >= 0 ? 'up' : 'down'}>{fmtRate(after?.currentValue)}</strong><small>{after?.observedMemberCount ? `${after.observedMemberCount}종목 실제 샘플` : '중복 없이 변화분만'}</small></div>
                      <AfterHoursSparkline points={after?.points ?? []} accent={accent} />
                    </div>
                  })}
                </div>
                <div className=\"us-session-foot\"><span>정규장 마감 <b>{displayKstTime(regularSession?.closedAt)}</b></span><span>애프터 최근 샘플 <b>{displayKstTime(afterHours?.sampledAt)}</b></span><span>애프터 관측 종목 <b>{afterHours?.observedSymbols ?? 0}</b></span><span>애프터 거래대금 <b>표시 안 함 · 검증값 없음</b></span></div>
              </section>

              <section className=\"theme-strength-board panel\" data-testid=\"us-theme-strength-board\">
          """)

          replace_once(frontend,
          """            <p>US THEME ROTATION / STOCK TOP 50</p>
                <h1>미국 테마 강도 비교 <span>(ETF/ETN 제외 · 개별주 거래대금 TOP50)</span></h1>
                <small>개별주 TOP50으로 5개 주도 테마를 구성합니다. 중앙 차트는 장중 실제 현재가를 30초마다 저장해 연결하고 순간 튐은 90초 추세로 완화합니다. 토스가 과거 30초 캔들을 제공하지 않는 구간은 실제 1분봉만 사용하며 30초 값을 임의 보간하지 않습니다.</small>
          """,
          """            <p>US REGULAR SESSION / STOCK TOP 50</p>
                <h1>미국 정규장 기록 <span>(09:30~16:00 ET · ETF/ETN 제외)</span></h1>
                <small>이 영역은 정규장 상황만 보존합니다. 개별주 TOP50·5개 주도 테마·정규장 1분봉과 정규장 중 실제 30초 가격만 사용하며, 16:00 ET 이후 데이터는 위 비교 영역과 애프터 변동 목록에만 따로 표시합니다.</small>
          """)

          replace_once(frontend,
          """            <div className=\"segmented-control\"><button className=\"active\">전일 + 오늘</button><button disabled>3일</button><button disabled>5일</button></div>
          """,
          """            <div className=\"segmented-control\"><button className=\"active\">정규장 2거래일</button><button disabled>3일</button><button disabled>5일</button></div>
          """)

          replace_once(frontend,
          """    <aside className=\"top100-rail panel\" data-testid=\"us-top100-ranking\">
              <div className=\"top100-tabs\"><button className=\"active\">미국 개별주 거래대금 TOP50</button><button disabled>ETF/ETN 제외</button></div>
          """,
          """    <aside className=\"top100-rail panel\" data-testid=\"us-top100-ranking\">
              <div className=\"top100-tabs\"><button className=\"active\">정규장 거래대금 TOP50</button><button disabled>ETF/ETN 제외</button></div>
              <section className=\"us-after-movers\" data-testid=\"us-after-hours-movers\">
                <div className=\"us-after-movers-head\"><div><p>AFTER HOURS DELTA</p><h3>정규장 이후 변동 종목</h3></div><span>16:00 ET 종가 대비</span></div>
                {afterMovers.slice(0, 10).map((item, index) => <div className=\"us-after-mover\" key={`after-${item.symbol}`}>
                  <b>{index + 1}</b><div><strong>{item.symbol} · {item.name}</strong><small>{item.theme} · 종가 {fmtUsdPrice(item.regularClose)} → {fmtUsdPrice(item.afterHoursPrice)}</small></div><strong className={item.afterHoursChangeRate >= 0 ? 'up' : 'down'}>{fmtRate(item.afterHoursChangeRate)}</strong>
                </div>)}
                {!afterMovers.length && <div className=\"us-after-empty\">검증된 16:00 ET 이후 가격 샘플을 기다리고 있습니다. 정규장 데이터를 복사해 채우지 않습니다.</div>}
              </section>
          """)

          replace_once(frontend,
          """      <div className=\"top100-head\"><div><p>US STOCK TURNOVER / 1 DAY</p><h2>미국 거래대금 TOP50 · 개별주만</h2></div><span>{displayKstTime(flow.rankedAt ?? flow.updatedAt)}</span></div>
          """,
