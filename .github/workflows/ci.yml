name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        id: install
        run: npm install

      - name: Type check
        id: typecheck
        run: npm run check

      - name: Unit tests
        id: unit
        run: npm test

      - name: Backend tests
        id: backend
        run: node --test backend/*.test.mjs

      - name: Build
        id: build
        run: npm run build

      - name: Docker compose build
        id: docker
        run: docker compose build

      - name: Install Playwright Chromium
        id: playwright_install
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        id: e2e
        run: npm run test:e2e

      - name: Write AI run summary
        if: always()
        shell: bash
        run: |
          mkdir -p ai-run
          cat > ai-run/summary.json <<EOF
          {
            "repository": "${{ github.repository }}",
            "ref": "${{ github.ref }}",
            "commit": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}",
            "event": "${{ github.event_name }}",
            "install": "${{ steps.install.outcome }}",
            "typecheck": "${{ steps.typecheck.outcome }}",
            "unit": "${{ steps.unit.outcome }}",
            "backend": "${{ steps.backend.outcome }}",
            "build": "${{ steps.build.outcome }}",
            "docker": "${{ steps.docker.outcome }}",
            "playwright_install": "${{ steps.playwright_install.outcome }}",
            "e2e": "${{ steps.e2e.outcome }}"
          }
          EOF

      - name: Upload browser test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-artifacts
          path: |
            playwright-report/
            test-results/
            ai-run/
          if-no-files-found: ignore
          retention-days: 7
