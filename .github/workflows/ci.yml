name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Backend tests
        run: node --test backend/*.test.mjs
      - name: Backend HTTP smoke test
        shell: bash
        run: |
          set -euo pipefail
          PORT=18787 PREPARED_DATA_DIR=/tmp/market-prepared node backend/server.mjs >/tmp/market-backend-smoke.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18787/api/health >/tmp/market-health.json; then
              cat /tmp/market-health.json
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/market-backend-smoke.log || true
          exit 1
      - name: Production build
        run: npm run build
      - name: Validate runtime frontend image
        run: docker build -f Dockerfile.frontend.runtime -t market-flow-frontend-ci .
      - name: Smoke test runtime module MIME
        shell: bash
        run: |
          set -euo pipefail
          # nginx resolves configured API upstreams at startup. This smoke test only
          # exercises static files, so provide harmless hosts entries rather than
          # starting the full application stack.
          docker run -d --rm --name market-flow-frontend-smoke \
            --add-host backend:127.0.0.1 \
            --add-host theme-admin:127.0.0.1 \
            -p 18080:80 market-flow-frontend-ci >/dev/null
          trap 'docker rm -f market-flow-frontend-smoke >/dev/null 2>&1 || true' EXIT

          READY=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/ >/tmp/runtime-index.html; then
              READY=1
              break
            fi
            sleep 0.25
          done
          if [ "$READY" -ne 1 ]; then
            echo 'Runtime nginx never became reachable'
            docker logs market-flow-frontend-smoke || true
            exit 1
          fi

          module_src="$(grep -oE 'src="[^"]+\.js"' /tmp/runtime-index.html | head -n 1 | cut -d'"' -f2)"
          test -n "$module_src" || { echo 'No JavaScript module found in built index.html'; cat /tmp/runtime-index.html; exit 1; }
          module_path="${module_src#./}"
          module_path="/${module_path#/}"

          curl --fail --silent --show-error -D /tmp/runtime-module.headers \
            "http://127.0.0.1:18080${module_path}" -o /tmp/runtime-module.js
          content_type="$(awk 'BEGIN{IGNORECASE=1} /^Content-Type:/ {gsub("\r",""); print $2; exit}' /tmp/runtime-module.headers)"

          echo "Runtime module: $module_path"
          echo "Content-Type: ${content_type:-missing}"
          case "$content_type" in
            application/javascript|text/javascript) ;;
            *)
              echo 'Runtime module did not return JavaScript MIME type'
              head -c 200 /tmp/runtime-module.js || true
              exit 1
              ;;
          esac

          if head -c 50 /tmp/runtime-module.js | grep -qi '<!doctype\|<html'; then
            echo 'Runtime module path returned HTML instead of JavaScript'
            exit 1
          fi
      - name: Upload frontend deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 3

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build backend container
        run: docker compose build backend

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Upload browser test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
