name: Deploy to Raspberry Pi

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-pi
  cancel-in-progress: true

jobs:
  deploy:
    # Public-repo safety: never execute pull-request code on the Pi.
    # Only a successful CI run for a direct push to main may reach this runner.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: [self-hosted, linux, ARM64, k-market-pi]
    timeout-minutes: 15

    steps:
      - name: Deploy exact verified commit
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          APP="$HOME/vibe-coding-playground"
          cd "$APP"

          # Never overwrite the Pi-local .env/secrets. The repository is public.
          test -f .env || { echo "Missing $APP/.env; refusing deployment"; exit 1; }

          PREVIOUS_SHA="$(git rev-parse HEAD 2>/dev/null || true)"
          git fetch --prune origin main

          SERVICES=""
          if [ -n "$PREVIOUS_SHA" ] && git cat-file -e "$PREVIOUS_SHA^{commit}" 2>/dev/null; then
            CHANGED="$(git diff --name-only "$PREVIOUS_SHA" "$VERIFIED_SHA" || true)"
            echo "Changed files since previous deployment:"
            echo "$CHANGED"

            if echo "$CHANGED" | grep -Eq '^(backend/|backend\.Dockerfile)'; then
              SERVICES="$SERVICES backend"
            fi
            if echo "$CHANGED" | grep -Eq '^(src/|index\.html|Dockerfile\.frontend|docker/|vite\.config\.ts|package(-lock)?\.json|tsconfig.*\.json)'; then
              SERVICES="$SERVICES frontend"
            fi
          else
            SERVICES="backend frontend"
          fi

          git checkout --detach "$VERIFIED_SHA"

          # Build only images whose application/build inputs changed.
          # Compose-only configuration changes are applied by `docker compose up`
          # without recompiling React on the low-power Pi.
          if [ -n "$(echo "$SERVICES" | xargs)" ]; then
            UNIQUE_SERVICES="$(echo "$SERVICES" | xargs -n1 | sort -u | xargs)"
            echo "Rebuilding services: $UNIQUE_SERVICES"
            docker compose build $UNIQUE_SERVICES
          else
            echo "No application image changes detected; reusing existing images"
          fi

          if ! docker compose up -d --remove-orphans; then
            echo "docker compose up failed"
            docker compose ps || true
            docker compose logs --tail=200 backend frontend || true
            exit 1
          fi

          # Phase 1: verify the public nginx -> backend path is reachable.
          API_LIVE=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://localhost:8080/api/health >/tmp/k-market-health.json; then
              API_LIVE=1
              break
            fi
            sleep 2
          done

          if [ "$API_LIVE" -ne 1 ]; then
            echo "Backend HTTP API never became reachable"
            docker compose ps || true
            docker compose logs --tail=220 backend frontend || true
            exit 1
          fi

          # Phase 2: do not depend on a host Node.js install. The self-hosted Pi
          # runner intentionally only needs bash/curl/docker, so parse the compact
          # JSON response with grep and finish as soon as real market data is ready.
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error http://localhost:8080/api/health >/tmp/k-market-health.json; then
              if grep -q '"marketReady":true' /tmp/k-market-health.json; then
                cat /tmp/k-market-health.json
                echo
                echo "Market data is ready"
                echo "Deployed verified commit: $VERIFIED_SHA"
                exit 0
              fi
              if [ $((attempt % 10)) -eq 0 ]; then
                echo "Waiting for market data (attempt $attempt/90)"
                cat /tmp/k-market-health.json
                echo
              fi
            fi
            sleep 2
          done

          echo "HTTP API is live but market data did not become ready in time"
          cat /tmp/k-market-health.json 2>/dev/null || true
          docker compose ps || true
          docker compose logs --tail=220 backend frontend || true
          exit 1
