name: Deploy to Raspberry Pi

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-pi
  cancel-in-progress: true

jobs:
  deploy:
    # Public-repo safety: never execute pull-request code on the Pi.
    # Only a successful CI run for a direct push to main may reach this runner.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: [self-hosted, linux, ARM64, k-market-pi]
    timeout-minutes: 10

    steps:
      - name: Download verified frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ${{ runner.temp }}/frontend-dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Deploy exact verified commit
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          APP="$HOME/vibe-coding-playground"
          cd "$APP"

          # Never overwrite the Pi-local .env/secrets. The repository is public.
          test -f .env || { echo "Missing $APP/.env; refusing deployment"; exit 1; }

          PREVIOUS_SHA="$(git rev-parse HEAD 2>/dev/null || true)"
          git fetch --prune origin main

          SERVICES=""
          if [ -n "$PREVIOUS_SHA" ] && git cat-file -e "$PREVIOUS_SHA^{commit}" 2>/dev/null; then
            CHANGED="$(git diff --name-only "$PREVIOUS_SHA" "$VERIFIED_SHA" || true)"
            echo "Changed files since previous deployment:"
            echo "$CHANGED"

            if echo "$CHANGED" | grep -Eq '^(backend/|backend\.Dockerfile)'; then
              SERVICES="$SERVICES backend"
            fi
            if echo "$CHANGED" | grep -Eq '^(src/|public/|index\.html|Dockerfile\.frontend|docker/|vite\.config\.ts|package(-lock)?\.json|tsconfig.*\.json)'; then
              SERVICES="$SERVICES frontend"
            fi
          else
            SERVICES="backend frontend"
          fi

          git checkout --detach "$VERIFIED_SHA"

          # React/TypeScript/Vite was already built and tested on GitHub-hosted CI.
          # The Pi receives only the verified dist artifact and never recompiles React.
          rm -rf "$APP/dist"
          mkdir -p "$APP/dist"
          cp -a "$RUNNER_TEMP/frontend-dist/." "$APP/dist/"

          if echo " $SERVICES " | grep -q ' backend '; then
            echo "Rebuilding backend"
            docker compose build backend
          fi

          if echo " $SERVICES " | grep -q ' frontend '; then
            echo "Wrapping prebuilt frontend dist in nginx runtime image"
            docker build -f Dockerfile.frontend.runtime -t vibe-coding-playground-frontend:latest .
          fi

          if [ -z "$(echo "$SERVICES" | xargs)" ]; then
            echo "No application image changes detected; reusing existing images"
          fi

          if ! docker compose up -d --remove-orphans; then
            echo "docker compose up failed"
            docker compose ps || true
            docker compose logs --tail=200 backend frontend || true
            exit 1
          fi

          # Deployment availability is based on an immediately servable last-good
          # snapshot. Fresh collection continues in the background and never blocks users.
          API_LIVE=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:8080/api/health >/tmp/k-market-health.json; then
              API_LIVE=1
              break
            fi
            sleep 1
          done

          if [ "$API_LIVE" -ne 1 ]; then
            echo "Backend HTTP API never became reachable"
            docker compose ps || true
            docker compose logs --tail=220 backend frontend || true
            exit 1
          fi

          SNAPSHOT_READY=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:8080/api/market/snapshot >/tmp/k-market-snapshot.json; then
              if grep -q '"updatedAt"' /tmp/k-market-snapshot.json; then
                SNAPSHOT_READY=1
                break
              fi
            fi
            sleep 1
          done

          if [ "$SNAPSHOT_READY" -ne 1 ]; then
            echo "No prepared or fresh market snapshot became available"
            cat /tmp/k-market-health.json 2>/dev/null || true
            docker compose ps || true
            docker compose logs --tail=220 backend frontend || true
            exit 1
          fi

          # Catch the exact browser failure where a missing hashed module path falls
          # through to index.html and nginx responds with text/html.
          curl --fail --silent --show-error http://localhost:8080/ >/tmp/runtime-index.html
          module_src="$(grep -oE 'src="[^"]+\.js"' /tmp/runtime-index.html | head -n 1 | cut -d'"' -f2)"
          test -n "$module_src" || { echo 'No JavaScript module found in deployed index.html'; cat /tmp/runtime-index.html; exit 1; }
          module_path="${module_src#./}"
          module_path="/${module_path#/}"
          curl --fail --silent --show-error -D /tmp/runtime-module.headers \
            "http://localhost:8080${module_path}" -o /tmp/runtime-module.js
          content_type="$(awk 'BEGIN{IGNORECASE=1} /^Content-Type:/ {gsub("\r",""); print $2; exit}' /tmp/runtime-module.headers)"
          echo "Deployed runtime module: $module_path"
          echo "Deployed module Content-Type: ${content_type:-missing}"
          case "$content_type" in
            application/javascript|text/javascript) ;;
            *)
              echo 'Deployed module did not return a JavaScript MIME type'
              head -c 200 /tmp/runtime-module.js || true
              exit 1
              ;;
          esac
          if head -c 50 /tmp/runtime-module.js | grep -qi '<!doctype\|<html'; then
            echo 'Deployed module path returned HTML instead of JavaScript'
            exit 1
          fi

          # Secondary tunnel recovery layer. The dedicated tunnel-status workflow is
          # the normal monitor, but if it has already recorded an unreachable Quick
          # Tunnel, a successful app deployment is a safe opportunity to rotate the
          # stale cloudflared process. This does not run PR code and never exposes a
          # secret. The following status workflow publishes the newly allocated URL.
          TUNNEL_REGISTRY="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/tunnel-status/CURRENT_TUNNEL.md"
          TUNNEL_STATUS="$(curl --fail --silent --show-error --max-time 8 "$TUNNEL_REGISTRY" 2>/dev/null || true)"
          if printf '%s' "$TUNNEL_STATUS" | grep -q '상태: `unreachable`'; then
            echo "Tunnel registry reports unreachable; rotating market-tunnel.service"
            if systemctl --user restart market-tunnel.service >/dev/null 2>&1; then
              echo "Restarted user market-tunnel.service"
              sleep 3
            elif sudo -n systemctl restart market-tunnel.service >/dev/null 2>&1; then
              echo "Restarted system market-tunnel.service"
              sleep 3
            else
              echo "Tunnel restart was not permitted from the runner; status monitor will keep reporting the outage"
            fi
          fi

          echo "Instant snapshot path is ready"
          cat /tmp/k-market-health.json
          echo
          echo "Deployed verified commit: $VERIFIED_SHA"
