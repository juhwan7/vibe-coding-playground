name: Deploy to Raspberry Pi

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-pi
  cancel-in-progress: true

jobs:
  deploy:
    # Public-repo safety: never execute pull-request code on the Pi.
    # Only a successful CI run for a direct push to main may reach this runner.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: [self-hosted, linux, ARM64, k-market-pi]
    timeout-minutes: 15

    steps:
      - name: Deploy exact verified commit
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          APP="$HOME/vibe-coding-playground"
          cd "$APP"

          # Never overwrite the Pi-local .env/secrets. The repository is public.
          test -f .env || { echo "Missing $APP/.env; refusing deployment"; exit 1; }

          PREVIOUS_SHA="$(git rev-parse HEAD 2>/dev/null || true)"
          git fetch --prune origin main

          SERVICES=""
          if [ -n "$PREVIOUS_SHA" ] && git cat-file -e "$PREVIOUS_SHA^{commit}" 2>/dev/null; then
            CHANGED="$(git diff --name-only "$PREVIOUS_SHA" "$VERIFIED_SHA" || true)"
            echo "Changed files since previous deployment:"
            echo "$CHANGED"

            if echo "$CHANGED" | grep -Eq '^(backend/|backend\.Dockerfile|docker-compose\.yml)'; then
              SERVICES="$SERVICES backend"
            fi
            if echo "$CHANGED" | grep -Eq '^(src/|index\.html|Dockerfile\.frontend|docker/|vite\.config\.ts|package(-lock)?\.json|tsconfig.*\.json|docker-compose\.yml)'; then
              SERVICES="$SERVICES frontend"
            fi
          else
            SERVICES="backend frontend"
          fi

          git checkout --detach "$VERIFIED_SHA"

          # Build only the service whose files changed. This keeps the low-power Pi
          # from rebuilding both containers after every small UI or backend edit.
          if [ -n "$(echo "$SERVICES" | xargs)" ]; then
            UNIQUE_SERVICES="$(echo "$SERVICES" | xargs -n1 | sort -u | xargs)"
            echo "Rebuilding services: $UNIQUE_SERVICES"
            docker compose build $UNIQUE_SERVICES
          else
            echo "No application image changes detected; reusing existing images"
          fi
          docker compose up -d --remove-orphans

          # A 200 response alone is not enough: wait until the Toss market snapshot
          # has actually finished its first collection so the browser does not open
          # against an empty dashboard immediately after deployment.
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error http://localhost:8080/api/health >/tmp/k-market-health.json; then
              cat /tmp/k-market-health.json
              if node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/k-market-health.json','utf8')); process.exit(j.marketReady ? 0 : 1)"; then
                echo "Market data is ready"
                echo "Deployed verified commit: $VERIFIED_SHA"
                exit 0
              fi
            fi
            sleep 2
          done

          echo "Health check failed: web server responded but market data never became ready"
          docker compose ps
          docker compose logs --tail=180 backend frontend
          exit 1
